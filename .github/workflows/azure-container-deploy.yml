name: Build and Deploy to Azure Container Registry

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Azure Container Registry Login
        uses: azure/docker-login@v2
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Docker image (BuildKit secret for .env)
        run: |
          echo "${{ secrets.ENV }}" > src/.env.temp
          docker build --build-arg ENV_FILE=.env.temp -t ${{ secrets.ACR_LOGIN_SERVER }}/my-app:${{ github.sha }} src
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/my-app:${{ github.sha }}
        env:
          DOCKER_BUILDKIT: 1

      - name: Clean up .env.temp
        if: always()
        run: rm -f src/.env.temp

      - name: Deploy to Azure Web App for Containers
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          images: ${{ secrets.ACR_LOGIN_SERVER }}/my-app:${{ github.sha }}
          slot-name: 'Production'
